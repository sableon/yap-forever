name: tests

# Actions minutes are a paid budget (AGENTS.md, "GitHub Actions minutes"):
# - pull requests run Linux only; macOS and Windows (billed at a much higher rate) run on `v*` tags and by hand;
# - no run on a push to main: the pull request already tested that head;
# - a docs-only pull request runs only the publishable checks;
# - a new push cancels the branch's older run.
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # The job names stay "tests (<os>, <python>)": the main ruleset requires the Linux ones by name.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the commit identity check reads history back to its baseline
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Docs-only change?
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Docs-only: every changed file is under docs/ or is Markdown outside plugin/ (the skill's
          # Markdown under plugin/ is read by the tests). Only tests/test_publishable.py reads those files.
          code=false
          while IFS= read -r f; do
            case "$f" in
              docs/*) ;;
              plugin/*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$BASE...HEAD")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"
      - name: Unit tests
        if: steps.scope.outputs.code != 'false'
        run: python -m unittest discover -s tests -t . -v
      - name: Publishable checks only (docs-only change)
        if: steps.scope.outputs.code == 'false'
        run: python -m unittest discover -s tests -t . -p test_publishable.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff (a developer tool; the planner needs only the standard library)
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.6
          ruff check --output-format github plugin tests

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code plugin validate (pinned CLI; needs no login)
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.308
          claude --version
          # A marketplace run doesn't open the plugin's skill files, so the plugin is validated too.
          claude plugin validate . --strict
          claude plugin validate plugin --strict
