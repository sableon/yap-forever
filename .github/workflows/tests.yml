name: tests

on:
  push:  # a pull request's branch is tested by pull_request alone
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the commit identity check reads history back to its baseline
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff (a developer tool; the planner needs only the standard library)
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.6
          ruff check --output-format github plugin tests

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code plugin validate (pinned CLI; needs no login)
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.308
          claude --version
          # A marketplace run doesn't open the plugin's skill files, so the plugin is validated too.
          claude plugin validate . --strict
          claude plugin validate plugin --strict
