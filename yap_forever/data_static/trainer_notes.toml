# Facts from play (2026-11-19) about the Artisan and Master trainers: from what character level the
# first trip is comfortable, whether a flight path makes repeat visits easy, and small tips.
# Keyed by NPC ID from the Questie Forever data (foreverNpcDB.lua), the same IDs the guide names.
#
# Per trainer (all optional):
#   reach_level  = the character level from which the first trip is comfortable
#   flight_path  = true when a flight path makes repeat visits easy
#   note         = one short plain sentence
#   nearby       = services known from play to be near, whatever the data's radius finds:
#                  a list of "bank", "auction", "mail"
# For a trainer inside an instance, use group_level and solo_level (both) instead of reach_level.
#
# [cities] holds tips for a capital, keyed by the AreaTable zone ID: `1657 = "tip"`, or a table
# `[cities.1519]` with `tip` and `professions` (names like "alchemy"; the tip then shows only on
# rows of those professions). A tip is said once on a city row and never changes the route.
# Specialisation trainers are left out on purpose.

